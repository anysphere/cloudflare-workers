# Tool versions + canonical tasks.

[tools]
node = "22"

[tasks.build]
description = "Validate wrangler config and build the container image (dry-run deploy; needs Docker)"
run = "npx wrangler deploy --dry-run"

[tasks.test]
description = "Run spawn/config unit tests with vitest"
run = "npm test"

[tasks.lint]
description = "Typecheck the Worker sources (report only)"
run = "npx tsc --noEmit"
